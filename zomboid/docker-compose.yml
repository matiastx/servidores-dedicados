services:
  # Project Zomboid dedicated server.
  # Imagen oficial: https://github.com/Danixu/project-zomboid-server-docker
  # Tag fijado a proposito: la imagen trae el juego horneado y el entrypoint NO
  # actualiza el juego salvo FORCEUPDATE=true. Para actualizar hay que cambiar el
  # tag y redeployar (ver README.md).
  zomboid:
    image: danixu86/project-zomboid-dedicated-server:42.21-release-2
    container_name: zomboid
    restart: unless-stopped
    # Limites del contenedor. En apps Docker Compose Coolify NO aplica los
    # limits_memory/limits_cpus del panel (solo los usa para apps con
    # Dockerfile), asi que el limite va aca.
    # El VPS tiene 8 GB de RAM compartidos con Coolify e InsForge.
    # 6g (no 5g): con los 55 mods del cliente (vehiculos KI5 + libs de ropa/UI)
    # el server necesita ~4 GB de heap + ~1 GB nativo. Con 5g el cgroup lo mataba.
    mem_limit: 6g
    cpus: 3
    # El entrypoint manda 'quit' a la consola del juego y espera a que el mundo
    # se guarde. Con los 10s por defecto de Docker el servidor muere a mitad de
    # guardado y se pierde el estado.
    stop_grace_period: 120s
    ports:
      # Juego (puerto principal, UDP). OBLIGATORIO.
      - "16261:16261/udp"
      # UDPPORT, segunda conexion UDP directa (se escribe en el INI del server).
      # OBLIGATORIO: sin el, los clientes no pueden conectarse.
      - "16262:16262/udp"
      # NOTA: no hace falta publicar STEAMPORT1/STEAMPORT2 (8766/8767). En
      # Build 42 el GameServer usa SteamNetworkingSockets (SDR): sale hacia
      # Valve por puertos efimeros y Steam enruta a los clientes, asi que no
      # necesita puertos entrantes propios. Ademas B42 ya no acepta
      # -steamport1/-steamport2 ("unknown option" en los logs).
      # Rango TCP: un puerto por slot. 8 slots -> 16262-16272.
      # En Build 42 el server ya no los abre de forma nativa (el trafico de
      # juego va por UDP), pero se mantienen publicados y abiertos en el
      # firewall por requerimiento de los slots y por compatibilidad con
      # clientes/versiones que los usan.
      - "16262-16272:16262-16272/tcp"
      # RCON (administracion remota). Publicado SOLO en loopback: el bot corre
      # en el host y conecta a 127.0.0.1:27015 (zomboid_control.RCON_HOST).
      # Con "27015:27015/tcp" quedaba bound a 0.0.0.0 y era alcanzable desde
      # la LAN y desde los otros contenedores de la red de Coolify. El router
      # no reenvia el puerto, pero no hay que depender de eso.
      - "127.0.0.1:27015:27015/tcp"
    environment:
      # Cuenta admin del server (obligatoria ADMINPASSWORD en el primer arranque).
      ADMINUSERNAME: ${ADMINUSERNAME}
      # ADMINPASSWORD: OMITIDA a proposito. Solo hace falta para crear el mundo
      # por primera vez; el entrypoint la pasa como argumento del server y
      # queda en claro en los logs. El mundo ya esta creado, asi que la cuenta
      # admin conserva su clave inicial. Si se borra el mundo (ver README),
      # hay que volver a declararla aqui y setearla en Coolify.
      # ADMINPASSWORD: ${ADMINPASSWORD}
      # Nombre del server: SIN espacios ni caracteres especiales. Cambiarlo crea
      # un mundo nuevo (no se pierde el anterior, queda en otra carpeta).
      SERVERNAME: ${SERVERNAME}
      # Preset de partida. En Build 42 la imagen trae:
      # Apocalypse | Extinction | Outbreak | Rising | SixMonthsLater
      # Si el preset no existe en la imagen, el entrypoint aborta el arranque.
      SERVERPRESET: ${SERVERPRESET}
      # Public=true + NOSTEAM=false = el server se anuncia y aparece en el
      # navegador de servidores del juego (el listado "Internet" lo sirve Steam).
      PUBLIC: ${PUBLIC}
      DISPLAYNAME: ${DISPLAYNAME}
      # Puertos
      PORT: ${PORT}
      UDPPORT: ${UDPPORT}
      # Memoria de la JVM. MIN/MAX tienen prioridad si estan definido.
      MEMORY: ${MEMORY}
      MIN_MEMORY: ${MIN_MEMORY}
      MAX_MEMORY: ${MAX_MEMORY}
      # Mods
      MODFOLDERS: ${MODFOLDERS}
      # IDs de Workshop separados por punto y coma. Vacio = limpia la lista del INI.
      WORKSHOP_IDS: ${WORKSHOP_IDS}
      # IDs de mods locales separados por punto y coma. Vacio = limpia la lista.
      MOD_IDS: ${MOD_IDS}
      # 1 = deja intactos Mods/WorkshopItems del INI (gestion manual externa).
      SELF_MANAGED_MODS: ${SELF_MANAGED_MODS}
      # Seguridad y red
      STEAMVAC: ${STEAMVAC}
      # False/vacio = Steam habilitado: el server se registra en Steam y aparece
      # en el listado publico del juego. True = -nosteam: entrada solo por IP y
      # el server es invisible para el navegador de servidores.
      NOSTEAM: ${NOSTEAM}
      # User-Agent de las llamadas HTTP del juego. PublicServerUtil anuncia el
      # server en projectzomboid.com y no fija User-Agent, asi que Java manda
      # "Java/17.x" y Cloudflare responde 403 (managed challenge) en
      # /server_browser/serverVar.php. Con un UA de navegador el anuncio pasa.
      # Las comillas internas son OBLIGATORIAS: JAVA_TOOL_OPTIONS se parte por
      # espacios y sin ellas el JVM muere con "Unrecognized option: (Windows",
      # lo que ademas rompe el chequeo de start-server.sh ("Only 64bit is
      # supported" y el container queda en crash-loop).
      JAVA_TOOL_OPTIONS: '-Dhttp.agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"'
      # IP/interfaz donde escucha. Vacio = todas las interfaces.
      IP: ${IP}
      RCONPASSWORD: ${RCONPASSWORD}
      # Varios
      LANG: ${LANG}
      FORCEUPDATE: ${FORCEUPDATE}
      SOFTRESET: ${SOFTRESET}
      SERVERPRESETREPLACE: ${SERVERPRESETREPLACE}
      DEBUG: ${DEBUG}
    # Persistencia. OBLIGATORIO declararlos aqui: en apps Docker Compose, Coolify
    # NO inyecta los "Persistent Volumes" del panel. Es el parser el que lee estos
    # volumes, los renombra a "{uuid_app}_{slug}" y crea los volumes Docker.
    # Si no se declaran, el mundo vive en la capa del contenedor y se pierde en
    # cada redeploy.
    volumes:
      # Mundo (mapas, saves, INIs de configuracion, logs).
      - zomboid-data:/home/steam/Zomboid
      # Mods descargados de Steam Workshop.
      - zomboid-workshop:/home/steam/pz-dedicated/steamapps/workshop

volumes:
  # Declaracion para que el compose sea valido fuera de Coolify (uso local).
  # En Coolify estos nombres se reemplazan por "{uuid_app}_zomboid-data" y
  # "{uuid_app}_zomboid-workshop".
  zomboid-data:
  zomboid-workshop:
